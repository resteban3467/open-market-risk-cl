[project]
name = "cmf-regulatory-r07"
version = "0.1.0"
description = "Chilean CMF RAN 21-7 standardized market-risk capital calculation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["risk-data-core>=0.1.0"]

[tool.uv.sources]
risk-data-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmf_regulatory_r07"]
