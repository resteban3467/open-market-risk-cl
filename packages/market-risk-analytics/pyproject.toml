[project]
name = "market-risk-analytics"
version = "0.1.0"
description = "Market-risk analytics including EWMA VaR, ES, and backtesting."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["risk-data-core>=0.1.0"]

[tool.uv.sources]
risk-data-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_risk_analytics"]
