# =============================================================================
# Catálogo maestro de series de mercado — Open Market Risk (CL)
#
# Cada entrada mapea una serie con su fuente (bcch/fred), su adaptador
# (fx | factor | curve | volume), su tabla de destino analítica y su frecuencia.
#
#   adapter   -> destino final              -> staging derivado
#   fx        -> fct_fx_rates               -> (ninguno)
#   factor    -> fct_market_factors         -> stg_market_factors (frec. nativa)
#   curve     -> fct_market_curves (cero)   -> stg_market_curves (tasas par)
#   volume    -> fct_banking_volumes        -> (ninguno; saldos a frec. nativa)
#
#   bootstrap: true  -> convierte tasas par a tasas cero (curvas de bonos).
#   bootstrap: false -> solo guarda tasas par crudas (curvas swap/SPC, cuya
#                       construcción de ceros usa un algoritmo distinto).
#
# Notas de unidades:
#   * Curvas: se normalizan a decimal (0.0525 = 5.25%).
#   * Factores: nivel crudo de la fuente (TPM, VIX, IPC índice, etc.).
#   * Volúmenes: monto publicado por el BCCh (ver descripción de cada serie).
#
# Códigos verificados contra el catálogo BDE (SearchSeries) al construir.
# =============================================================================
